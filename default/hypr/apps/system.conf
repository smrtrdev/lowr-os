# Floating windows
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window

windowrule = tag +floating-window, match:class (org.lowr.bluetui|org.lowr.impala|org.lowr.wiremix|org.lowr.btop|org.lowr.terminal|org.lowr.bash|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|Lowr|About|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# Fullscreen screensaver
windowrule = fullscreen on, match:class org.lowr.screensaver
windowrule = float on, match:class org.lowr.screensaver
windowrule = animation slide, match:class org.lowr.screensaver

# No transparency on media windows
windowrule = tag -default-opacity, match:class ^(vlc|mpv|imv|org.gnome.NautilusPreviewer)$
windowrule = opacity 1 1, match:class ^(vlc|mpv|imv|org.gnome.NautilusPreviewer)$

# Popped window rounding
windowrule = rounding 8, match:tag pop

# Prevent idle while open
windowrule = idle_inhibit always, match:tag noidle
