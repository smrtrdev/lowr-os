# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(lowr-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(lowr-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, lowr-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(lowr-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, lowr-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, lowr-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, lowr-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, lowr-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, lowr-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, lowr-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, lowr-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, lowr-launch-webapp "https://grok.com"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, lowr-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Lowr Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Lowr menu, exec, lowr-menu
